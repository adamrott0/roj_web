name: Nasazení pravidel do Firebase

on:
  push:
    branches:
      - main
      - testing
    paths:
      - 'firebase/**'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-rules.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sestavení pravidel z admins.json
        run: node firebase/build-rules.mjs

      - name: Nasazení pravidel do Firebase
        run: npx firebase-tools deploy --only firestore:rules,storage --token "${{ secrets.FIREBASE_TOKEN }}" --project oddil-roj-ac78b
