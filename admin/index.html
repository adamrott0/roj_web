<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrace | Oddíl ROJ</title>
  <style>
    :root { --bg: #f5f4ee; --card: #fff; --ink: #1e241e; --muted: #5c655c; --line: #d8d6cb; --accent: #c85a32; --forest: #2d4c3b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    .wrap { max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: .5rem; padding: 1.25rem; margin-bottom: 1.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
    label { display: flex; flex-direction: column; gap: .3rem; font-size: .9rem; font-weight: 600; }
    input[type="text"], input[type="date"], input[type="email"], input[type="file"] { padding: .55rem .7rem; border: 1px solid var(--line); border-radius: .35rem; font: inherit; background: #fff; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; align-items: center; }
    button { padding: .55rem 1rem; border: 1px solid var(--forest); border-radius: .35rem; background: var(--forest); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
    button.danger { background: transparent; color: #a62626; border-color: #e2b4b4; }
    button:disabled { opacity: .5; cursor: wait; }
    .event-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--line); }
    .event-row:last-child { border-bottom: 0; }
    .meta { color: var(--muted); font-size: .85rem; }
    .status { font-size: .9rem; color: var(--forest); }
    .status.error { color: #a62626; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1 style="margin:0; font-size:1.4rem;">Administrace Oddíl ROJ</h1>
      <div id="user-bar" hidden>
        <span id="user-email" class="meta" style="margin-right:.75rem;"></span>
        <button id="logout-btn" class="secondary" type="button">Odhlásit</button>
      </div>
    </div>

    <section id="login-view" class="card">
      <p style="margin-top:0;">Pro správu obsahu se přihlas povoleným Google účtem.</p>
      <button id="login-btn" type="button">Přihlásit přes Google</button>
      <p id="auth-error" class="status error" hidden></p>
    </section>

    <main id="admin-view" hidden>
      <section class="card">
        <h2 id="form-title" style="margin-top:0; font-size:1.15rem;">Přidat novou akci</h2>
        <form id="event-form">
          <div class="grid">
            <label>Název akce *
              <input id="ev-name" type="text" required placeholder="např. Sportík">
            </label>
            <label>Datum od *
              <input id="ev-date-start" type="date" required>
            </label>
            <label>Datum do (volitelné)
              <input id="ev-date-end" type="date">
            </label>
            <label>Kontaktní e-mail *
              <input id="ev-mail" type="email" required placeholder="vedouci@modrykruh.cz">
            </label>
          </div>

          <div style="margin-top:1rem;">
            <label>Lísteček (obrázek nebo PDF, volitelné)
              <input id="ev-flyer" type="file" accept="image/*,application/pdf">
            </label>
            <div id="current-flyer-box" class="meta" style="margin-top:.4rem;" hidden>
              Aktuální soubor: <a id="current-flyer-link" href="#" target="_blank" rel="noopener">zobrazit</a>
              <label style="display:inline-flex; flex-direction:row; align-items:center; margin-left:.75rem; font-weight:400;">
                <input id="ev-remove-flyer" type="checkbox"> Smazat stávající lísteček
              </label>
            </div>
          </div>

          <div class="actions">
            <button id="submit-btn" type="submit">Uložit akci</button>
            <button id="cancel-edit-btn" class="secondary" type="button" hidden>Zrušit úpravu</button>
            <span id="form-status" class="status"></span>
          </div>
        </form>
      </section>

      <section class="card">
        <h2 style="margin-top:0; font-size:1.15rem;">Seznam akcí</h2>
        <div id="events-list" class="meta">Načítám akce…</div>
      </section>
    </main>
  </div>

  <script type="module" src="./admin.js"></script>
</body>
</html>
