<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrace | Oddíl ROJ</title>
  <link rel="icon" type="image/png" href="../assets/img/shared/logo.png?v=1">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin">
  <div data-component="header"></div>

  <main>
    <div class="admin-wrap">
      <div class="admin-topbar">
        <div>
          <h1 style="margin:0; font-size:1.5rem;">Administrace</h1>
        </div>
        <div id="user-bar" hidden>
          <span id="user-email" class="meta" style="margin-right:.75rem;"></span>
          <button id="logout-btn" class="btn secondary" type="button">Odhlásit</button>
        </div>
      </div>

      <section id="login-view" class="admin-card">
        <p style="margin-top:0;">Pro správu obsahu se přihlas povoleným Google účtem.</p>
        <button id="login-btn" class="btn" type="button">Přihlásit přes Google</button>
        <p id="auth-error" class="status error" hidden></p>
      </section>

      <div id="admin-view" hidden>
        <section class="admin-card">
          <h2 id="form-title" style="margin-top:0; font-size:1.2rem;">Přidat novou akci</h2>
          <form id="event-form" class="admin-form">
            <div class="admin-form-grid">
              <label>Název akce *
                <input id="ev-name" type="text" required>
              </label>
              <label>Datum od *
                <input id="ev-date-start" type="date" required>
              </label>
              <label>Datum do (volitelné)
                <input id="ev-date-end" type="date">
              </label>
              <label>Kontaktní e-mail (volitelné)
                <input id="ev-mail" type="email">
              </label>
              <label>Kontaktní telefon (volitelné)
                <input id="ev-phone" type="tel" inputmode="tel" autocomplete="tel">
              </label>
            </div>

            <div style="margin-top:1rem;">
              <label>Lísteček (obrázek, volitelné)
                <input id="ev-flyer" type="file" accept="image/*">
              </label>
              <div id="current-flyer-box" class="meta" style="margin-top:.4rem;" hidden>
                Aktuální soubor: <a id="current-flyer-link" href="#" target="_blank" rel="noopener">zobrazit</a>
                <label style="display:inline-flex; flex-direction:row; align-items:center; margin-left:.75rem; font-weight:400;">
                  <input id="ev-remove-flyer" type="checkbox"> Smazat stávající lísteček
                </label>
              </div>
            </div>

            <div class="admin-actions">
              <button id="submit-btn" class="btn" type="submit">Uložit akci</button>
              <button id="cancel-edit-btn" class="btn secondary" type="button" hidden>Zrušit úpravu</button>
              <span id="form-status" class="status"></span>
            </div>
          </form>
        </section>

        <section class="admin-card">
          <h2 style="margin-top:0; font-size:1.2rem;">Seznam akcí</h2>
          <div id="events-list" class="meta">Načítám akce…</div>
        </section>
      </div>
    </div>
  </main>

  <div id="confirm-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="confirm-modal__card">
      <h3 id="confirm-modal-title" style="margin-top:0; color:var(--forest); font-size:1.25rem;">Smazat akci</h3>
      <p id="confirm-modal-text" style="margin:.75rem 0 1.5rem; color:var(--ink); line-height:1.5;">Opravdu chcete tuto akci smazat? Tuto akci nelze vzít zpět.</p>
      <div style="display:flex; justify-content:flex-end; gap:.75rem;">
        <button type="button" class="btn secondary" id="confirm-modal-cancel">Zrušit</button>
        <button type="button" class="btn danger" id="confirm-modal-confirm">Smazat akci</button>
      </div>
    </div>
  </div>

  <div data-component="footer"></div>

  <script type="module" src="../assets/js/komponenty.js"></script>
  <script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
